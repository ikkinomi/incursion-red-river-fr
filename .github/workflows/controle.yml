name: Controle des traductions et assistants
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python maintenance/translation_audit.py --market translations/market-display-fr.json --baseline maintenance/baseline-0.2.1.json --output work/audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-traduction
          path: work/audit
